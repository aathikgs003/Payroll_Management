<!DOCTYPE html>
<html>
<head>
    <title>Payroll Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        .container {
            background: white;
            width: 400px;
            margin: 80px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        input {
            padding: 8px;
            width: 80%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            width: 85%;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 20px;
            text-align: left;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💼 Payroll Management System</h1>
        <form onsubmit="calculateSalary(); return false;">
            <label>Employee Name:</label>
            <input type="text" id="empName" required>

            <label>Basic Salary:</label>
            <input type="number" id="basicSalary" required>

            <button type="submit">Calculate Salary</button>
        </form>
        <div id="result"></div>
    </div>

    <!-- Link to JavaScript backend -->
    <script src="payroll_backend.js"></script>
</body>
</html>
